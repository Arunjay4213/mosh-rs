name: Auto-merge

# When CI is green on an agent/ or laptop/ branch, merge the PR with GitHub's "rebase and merge"
# and delete the branch. Required status checks (strict=false) were satisfied on the branch head.
# A rebase rewrites shas, so `scripts/landed.sh` checks patch equivalence (git cherry), not the sha.
# If the PR has conflicts with main, it gets a comment asking for a rebase.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: merge green PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'agent/') ||
       startsWith(github.event.workflow_run.head_branch, 'laptop/'))
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge
    steps:
      - name: Rebase-merge the green PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open \
            --json number,headRefOid --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "no open PR from $BRANCH at $SHA (newer push or no PR); nothing to do"; exit 0
          fi
          if gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --rebase --delete-branch; then
            echo "PR #$pr ($BRANCH at $SHA) rebase-merged into main"
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "Rebase onto main and push again (merge conflict). INTERVENTIONS.md, STATUS.md and CHANGELOG.md use the union merge driver, so a local git rebase resolves appends automatically."
          fi
