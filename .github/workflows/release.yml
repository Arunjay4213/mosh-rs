name: Release

on:
  push:
    tags: ['v*']
  # Manual run: builds, smoke-tests and packages every target, uploads them as
  # workflow artifacts, and publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Strip symbols from release binaries for every target, without editing Cargo.toml.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            tool: cargo
            bins: --bin mosh --bin mosh-client --bin mosh-server
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            tool: cross
            bins: --bin mosh --bin mosh-client --bin mosh-server
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            tool: cargo
            bins: --bin mosh --bin mosh-client --bin mosh-server
            archive: tar.gz
          # mosh-server is Unix-only, as upstream, so Windows ships the client side only.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            tool: cargo
            bins: --bin mosh --bin mosh-client
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.tool == 'cross'
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: ${{ matrix.tool }} build --release --locked --target ${{ matrix.target }} -p mosh ${{ matrix.bins }}

      - name: Smoke test
        # Runs the binaries on runners that can execute them (not the cross-built aarch64 musl one).
        if: matrix.tool == 'cargo'
        shell: bash
        env:
          TERM: xterm-256color
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          ext=""
          if [ "${{ matrix.archive }}" = "zip" ]; then ext=".exe"; fi
          "$out/mosh$ext" --version | head -1
          "$out/mosh-client$ext" --version | head -1
          colors=$("$out/mosh-client$ext" -c)
          echo "mosh-client -c: $colors"
          [ "$colors" = "256" ]
          if [ -z "$ext" ]; then
            "$out/mosh-server" --version | head -1
          fi
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            file "$out/mosh" "$out/mosh-client" "$out/mosh-server"
            if file "$out/mosh" "$out/mosh-client" "$out/mosh-server" | grep -q 'dynamically linked'; then
              echo "a Linux musl binary is dynamically linked" >&2
              exit 1
            fi
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="mosh-rs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          out="target/${{ matrix.target }}/release"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "$out/mosh.exe" "$out/mosh-client.exe" "$name/"
          else
            cp "$out/mosh" "$out/mosh-client" "$out/mosh-server" "$name/"
          fi
          cp LICENSE README.md "$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name"
            asset="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
