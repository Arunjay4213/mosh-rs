name: Open PR

# A push to an agent/ or laptop/ branch opens a PR against main if that branch has none open.
# CI runs on the push itself (ci.yml),  and auto-merge.yml lands the branch when CI is green.
on:
  push:
    branches: ['agent/**', 'laptop/**']

concurrency:
  group: pr-open-${{ github.ref }}

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    name: open PR
    runs-on: ubuntu-latest
    steps:
      - name: Open a PR unless one is open
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open for $BRANCH"; exit 0
          fi
          # A push whose commits are all on main already (pushed and merged at once) needs no PR.
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .ahead_by)
          if [ "$ahead" = 0 ]; then
            echo "$BRANCH has no commits that main lacks; no PR needed"; exit 0
          fi
          title=$(printf '%s\n' "$MESSAGE" | head -n 1)
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "${title:-$BRANCH}" \
            --body "Opened automatically for branch $BRANCH. Merges automatically when CI is green."
