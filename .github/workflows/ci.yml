name: CI

# Every branch push runs CI on its exact head commit. Agent and laptop work lands on main only by
# auto-merge.yml fast-forwarding main to a commit whose run here was green, so the commit on main
# is the commit that was tested. There is no pull_request trigger: a PR opened by pr-open.yml with
# GITHUB_TOKEN would not start one, and the push run already reports its checks on the PR.
on:
  push:
    branches-ignore: [ci-status]

# main: every commit gets its own run (group keyed by sha), because GitHub keeps only one queued
# run per group and would otherwise cancel queued main runs whenever the next push arrives.
# Other branches: one run per branch, newest push wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check 2>&1 | tee fmt.log; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-fmt
          path: fmt.log

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-clippy
          path: clippy.log

  # tests/run-all.sh runs everything serially (about 15 minutes). CI splits the same tests into
  # shards that run in parallel; the conformance shard fails if a tests/tests/*.rs file is in no shard.
  test:
    name: test (${{ matrix.shard }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        shard: [conformance, client, server, scrollback-sh]
    steps:
      - uses: actions/checkout@v4
      # mosh/tmux/ssh for tests/tests/launcher.rs; the rest builds upstream for the ref/ oracles.
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mosh tmux vim ncurses-term kitty-terminfo sysstat openssh-server libssl-dev zlib1g-dev libncurses-dev \
            libprotobuf-dev protobuf-compiler pkg-config autoconf automake build-essential locales
      - name: Cache upstream build
        uses: actions/cache@v4
        with:
          path: ~/src/mosh
          key: upstream-decd9b7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-upstream.sh') }}
      - name: Build upstream
        run: scripts/build-upstream.sh
      - name: Set up ssh localhost
        run: |
          chmod go-w ~
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          ssh-keyscan localhost 127.0.0.1 >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost true
          ssh -o BatchMode=yes 127.0.0.1 true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          conformance="crypto_conformance terminal_conformance terminfo_table statesync_roundtrip transport_roundtrip transport_sync udp_impair platform_tty launcher"
          client="client_e2e prediction_e2e"
          server="server_e2e detached_warning scrollback_server scrollback_hostile"
          failed=()
          run() { echo "== $*"; "$@" || failed+=("$*"); }
          {
            cargo build --release --workspace
            case "$SHARD" in
              conformance)
                for t in tests/tests/*.rs; do
                  n=$(basename "$t" .rs)
                  case " $conformance $client $server " in *" $n "*) ;; *) failed+=("$n is in no CI shard (add it in ci.yml)") ;; esac
                done
                run cargo test --release --workspace --exclude mosh-tests --no-fail-fast
                run cargo test --release -p mosh-tests --lib --bins --no-fail-fast
                for n in $conformance; do run cargo test --release -p mosh-tests --test "$n"; done ;;
              client) for n in $client; do run cargo test --release -p mosh-tests --test "$n"; done ;;
              server) for n in $server; do run cargo test --release -p mosh-tests --test "$n"; done ;;
              # The same shell drivers tests/run-all.sh runs: every executable tests/*.sh but itself.
              scrollback-sh)
                for t in tests/*.sh; do
                  if [ -x "$t" ] && [ "$(basename "$t")" != run-all.sh ]; then run "$t"; fi
                done ;;
            esac
            echo
            if [ ${#failed[@]} -ne 0 ]; then echo "shard $SHARD: FAILED: ${failed[*]}"; exit 1; fi
            echo "shard $SHARD: all passed"
          } 2>&1 | tee test.log; exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-test-${{ matrix.shard }}-${{ matrix.os }}
          path: test.log

  report:
    name: write result to ci-status branch
    needs: [fmt, clippy, test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: logs
      - name: Compose report
        env:
          R_FMT: ${{ needs.fmt.result }}
          R_CLIPPY: ${{ needs.clippy.result }}
          R_TEST: ${{ needs.test.result }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          short=$(git rev-parse --short=7 HEAD)
          overall=success
          for r in "$R_FMT" "$R_CLIPPY" "$R_TEST"; do [ "$r" = success ] || overall=failure; done
          pr=""
          if [ "$BRANCH" != main ]; then
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' || true)
          fi
          {
            echo "result: $overall"
            echo "commit: $(git rev-parse HEAD)"
            echo "branch: $BRANCH"
            echo "pr: ${pr:-none}"
            echo "subject: $(git log -1 --format=%s)"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "fmt: $R_FMT"; echo "clippy: $R_CLIPPY"; echo "test: $R_TEST"
            for d in logs/*/; do
              [ -d "$d" ] || continue
              n=$(basename "$d"); f=$(ls "$d" | head -1)
              echo; echo "## $n: failures"; echo '```'
              # grep exits 1 when a log has no failures; that is the passing case, not an error.
              sed 's/\x1b\[[0-9;]*m//g' "$d/$f" | grep -E -A4 'FAILED|panicked at|^run-all:|^shard .*: FAILED|^error(\[E[0-9]+\])?:|SKIPPED|FAIL:|^FAIL ' | head -n 200 || true
              echo '```'
              echo; echo "## $n (last 80 lines)"; echo '```'
              tail -n 80 "$d/$f" | sed 's/\x1b\[[0-9;]*m//g'
              echo '```'
            done
          } > report.md
          mkdir -p out/runs && cp report.md "out/runs/$short.md" && cp report.md out/latest.md
          if [ -n "$pr" ]; then mkdir -p out/prs && cp report.md "out/prs/$pr.md"; fi
          echo "short=$short" >> "$GITHUB_ENV"
      - name: Push to ci-status branch
        shell: bash
        run: |
          git config user.name "ci-status bot"; git config user.email "ci-status@users.noreply.github.com"
          # Parallel runs push here at the same time. Each attempt starts again from the newest
          # ci-status, copies this run's files on top, and pushes; a rejected push just retries.
          for attempt in 1 2 3 4 5; do
            rm -rf st && git worktree prune
            if git fetch -q origin ci-status; then
              git worktree add -q --detach st origin/ci-status
            else
              git worktree add -q --detach st && (cd st && git checkout -q --orphan ci-status && { git rm -rqf . 2>/dev/null || true; })
            fi
            cp -r out/. st/
            (cd st && git add -A && git commit -q -m "ci result for $short" && git push -q origin HEAD:refs/heads/ci-status) && exit 0
            echo "push attempt $attempt rejected, retrying"; sleep $((attempt * 3))
          done
          echo "could not push to ci-status after 5 attempts"; exit 1
