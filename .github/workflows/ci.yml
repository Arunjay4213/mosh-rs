name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check 2>&1 | tee fmt.log; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-fmt
          path: fmt.log

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-clippy
          path: clippy.log

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      # mosh/tmux/ssh for tests/tests/launcher.rs; the rest builds upstream for the ref/ oracles.
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mosh tmux openssh-server libssl-dev zlib1g-dev libncurses-dev \
            libprotobuf-dev protobuf-compiler pkg-config autoconf automake build-essential locales
      - name: Cache upstream build
        uses: actions/cache@v4
        with:
          path: ~/src/mosh
          key: upstream-decd9b7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-upstream.sh') }}
      - name: Build upstream
        run: scripts/build-upstream.sh
      - name: Set up ssh localhost
        run: |
          chmod go-w ~
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          ssh-keyscan localhost 127.0.0.1 >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost true
          ssh -o BatchMode=yes 127.0.0.1 true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: (cargo build --release --workspace && cargo test --release --workspace) 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-test-${{ matrix.os }}
          path: test.log

  report:
    name: write result to ci-status branch
    needs: [fmt, clippy, test]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: logs
      - name: Compose report
        env:
          R_FMT: ${{ needs.fmt.result }}
          R_CLIPPY: ${{ needs.clippy.result }}
          R_TEST: ${{ needs.test.result }}
        shell: bash
        run: |
          short=$(git rev-parse --short=7 HEAD)
          overall=success
          for r in "$R_FMT" "$R_CLIPPY" "$R_TEST"; do [ "$r" = success ] || overall=failure; done
          {
            echo "result: $overall"
            echo "commit: $(git rev-parse HEAD)"
            echo "subject: $(git log -1 --format=%s)"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "fmt: $R_FMT"; echo "clippy: $R_CLIPPY"; echo "test: $R_TEST"
            for d in logs/*/; do
              n=$(basename "$d"); f=$(ls "$d" | head -1)
              echo; echo "## $n (last 80 lines)"; echo '```'
              tail -n 80 "$d/$f" | sed 's/\x1b\[[0-9;]*m//g'
              echo '```'
            done
          } > report.md
          mkdir -p out/runs && cp report.md "out/runs/$short.md" && cp report.md out/latest.md
      - name: Push to ci-status branch
        shell: bash
        run: |
          git config user.name "ci-status bot"; git config user.email "ci-status@users.noreply.github.com"
          if git fetch -q origin ci-status; then
            git worktree add -q st origin/ci-status
          else
            git worktree add -q --detach st && (cd st && git checkout -q --orphan ci-status && git rm -rqf . 2>/dev/null || true)
          fi
          mkdir -p st/runs && cp out/latest.md st/latest.md && cp out/runs/*.md st/runs/
          cd st && git add -A && git commit -q -m "ci result for $(git -C .. rev-parse --short=7 HEAD)" && git push -q origin HEAD:ci-status
