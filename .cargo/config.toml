[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# Static Linux release builds (scripts/build-release.sh). The Rust musl
# targets ship musl's libc and crt objects themselves (self-contained
# linking), so any gcc for the right architecture can drive the link.
[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-gnu-gcc"

# Windows release builds: link the C runtime statically, so mosh.exe and
# mosh-client.exe start on a clean Windows install. Without this they import
# VCRUNTIME140.dll from the Visual C++ redistributable, which a fresh machine
# does not have (winget validation of 0.1.3, 2026-11-05: STATUS_DLL_NOT_FOUND).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
