[workspace]
resolver = "2"
members = [
    "crates/terminal",
    "crates/network",
    "crates/platform",
    "crates/mosh",
    "tests",
    "tools",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
# Minimum supported Rust, verified: 1.88 is refused by the aes crate (0.9.3 needs 1.89).
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/Arunjay4213/mosh-rs"
homepage = "https://github.com/Arunjay4213/mosh-rs"
readme = "README.md"

[workspace.dependencies]
# The publishable crates. crates.io needs a version on every path dependency;
# keep it equal to workspace.package.version when bumping.
mosh-terminal = { path = "crates/terminal", version = "0.1.2" }
mosh-network = { path = "crates/network", version = "0.1.2" }
mosh-platform = { path = "crates/platform", version = "0.1.2" }
mosh = { package = "mosh", path = "crates/mosh", version = "0.1.2" }
aes = "^0.9.3"
ocb3 = "^0.2.0"
rand = "^0.10.3"
prost = "^0.14.4"
flate2 = { version = "^1.1.10", default-features = false, features = ["zlib-rs"] }
nix = { version = "^0.31.3", features = ["term", "process", "poll", "signal", "fs", "ioctl", "socket", "net"] }
libc = "^0.2.190"
windows-sys = { version = "^0.61.2", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
