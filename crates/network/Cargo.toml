[package]
name = "mosh-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# zeroize: wipe the AES key schedule on drop, as upstream's ae_clear() does
aes = { workspace = true, features = ["zeroize"] }
ocb3.workspace = true
rand.workspace = true
prost.workspace = true
flate2.workspace = true
mosh-platform = { path = "../platform" }
# already in the build through aes; used directly to wipe Session's key copy without unsafe
zeroize = "1"
