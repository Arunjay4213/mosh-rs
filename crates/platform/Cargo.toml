[package]
name = "mosh-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Platform layer of mosh-rs (tty, pty, process spawning, UDP sockets, select loop) for Unix and Windows"
keywords = ["mosh", "pty", "tty", "udp", "terminal"]
categories = ["os::unix-apis", "os::windows-apis", "network-programming"]
include = ["src/**/*.rs", "LICENSE"]

[dependencies]
libc.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_IO"] }
